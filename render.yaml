services:
  - type: web
    name: food-safety-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn food_safety_system.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
