<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>نظام تقييم المنشآت الغذائية</title>
    <link rel="stylesheet" href="{% static 'inspections/style.css' %}?v=10">
</head>
<body>
<header class="topbar">
    <div class="brand-block">
        <img src="{% static 'inspections/logo.png' %}?v=6" alt="مركز سلامة وجودة الغذاء" class="header-logo" width="158" height="54">
        <div>
            <h1>نظام تقييم المنشآت الغذائية</h1>
            <p>مركز سلامة وجودة الغذاء</p>
        </div>
    </div>
    <div class="topbar-actions">
        <div class="site-clock" aria-live="polite">
            <span id="clock-time">--:--:--</span>
            <small id="clock-date">--</small>
        </div>
        <nav>
            <a href="{% url 'evaluation_list' %}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                التقارير
            </a>
            <a href="{% url 'evaluation_form' %}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                تقييم جديد
            </a>
        </nav>
    </div>
</header>

<main class="container">
{% if messages %}
    {% for message in messages %}
        <div class="alert">{{ message }}</div>
    {% endfor %}
{% endif %}

{% block content %}{% endblock %}
</main>

<script>
function updateSiteClock() {
    const now = new Date();
    const timeEl = document.getElementById("clock-time");
    const dateEl = document.getElementById("clock-date");

    if (!timeEl || !dateEl) return;

    timeEl.textContent = now.toLocaleTimeString("ar-OM", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
    });
    dateEl.textContent = now.toLocaleDateString("ar-OM", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
    });
}

updateSiteClock();
setInterval(updateSiteClock, 1000);
</script>
</body>
</html>
